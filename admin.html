
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA3WA | لوحة الإدارة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171315;color:#f5eee8;font-family:Arial,sans-serif}
header{padding:22px 5%;background:#291c21;border-bottom:1px solid #59404a;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:0;color:#e8c98d}
main{max-width:1100px;margin:35px auto;padding:0 18px}
.panel{background:#251d20;border:1px solid #49343c;border-radius:16px;padding:24px;margin-bottom:22px}
input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #60434c;background:#171315;color:white;margin:8px 0 15px;font-size:15px}
button{border:0;border-radius:9px;padding:11px 17px;cursor:pointer;font-weight:bold;background:#d5b47a;color:#211719}
button:hover{opacity:.85}
button.secondary{background:#49343c;color:white}
button.danger{background:#8d343d;color:white}
.hidden{display:none!important}
.muted{color:#b9a9ad;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{background:#302329;padding:18px;border-radius:12px;border:1px solid #49343c}
.stat strong{display:block;font-size:25px;color:#e8c98d;margin-top:8px}
.order{background:#251d20;border:1px solid #49343c;border-radius:14px;padding:18px;margin:14px 0}
.order h3{margin:0 0 12px;color:#e8c98d}
.details{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.detail{background:#302329;padding:11px;border-radius:8px;overflow-wrap:anywhere}
.detail small{display:block;color:#b9a9ad;margin-bottom:5px}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.actions select{max-width:220px;margin:0}
#message{margin:12px 0;color:#e8c98d}
@media(max-width:600px){
.stats{grid-template-columns:1fr}
.details{grid-template-columns:1fr}
header{padding:18px}
}
</style>
</head>
<body>

<header>
  <h1>DA3WA | الإدارة</h1>
  <button id="logoutBtn" class="secondary hidden">تسجيل الخروج</button>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>تسجيل دخول الإدارة</h2>
    <p class="muted">هذه الصفحة مخصصة لإدارة طلبات دعوة</p>
    <form id="loginForm">
      <label>البريد الإلكتروني</label>
      <input id="email" type="email" required placeholder="admin@email.com">
      <label>كلمة المرور</label>
      <input id="password" type="password" required placeholder="كلمة المرور">
      <button type="submit">دخول إلى لوحة الإدارة</button>
    </form>
    <p id="message"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="stats">
      <div class="stat">إجمالي الطلبات<strong id="total">0</strong></div>
      <div class="stat">طلبات جديدة<strong id="newCount">0</strong></div>
      <div class="stat">طلبات مكتملة<strong id="doneCount">0</strong></div>
    </div>

    <div class="panel">
      <div class="actions">
        <h2 style="flex:1">الطلبات</h2>
        <button id="refreshBtn">تحديث الطلبات</button>
      </div>
      <p class="muted">تظهر هنا الطلبات المحفوظة في قاعدة البيانات.</p>
      <p id="ordersMessage"></p>
      <div id="ordersList"></div>
    </div>
  </section>
</main>

<script>
const PROJECT_URL = "https://xnabtqiukgcbukrmpyle.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_-fZR33L75gcyESGdh0OYTg_Ct1Iamlz";

const db = window.supabase.createClient(
  PROJECT_URL,
  PUBLISHABLE_KEY
);

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const ordersMessage = document.getElementById("ordersMessage");
const ordersList = document.getElementById("ordersList");
const logoutBtn = document.getElementById("logoutBtn");

const statusNames = {
  new: "جديد",
  pending: "قيد الانتظار",
  in_progress: "قيد التنفيذ",
  completed: "مكتمل",
  rejected: "مرفوض"
};

function showLogin() {
  loginPanel.classList.remove("hidden");
  dashboard.classList.add("hidden");
  logoutBtn.classList.add("hidden");
}

function showDashboard() {
  loginPanel.classList.add("hidden");
  dashboard.classList.remove("hidden");
  logoutBtn.classList.remove("hidden");
}

async function verifyAdmin(user) {
  const { data, error } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) throw error;
  if (!data) throw new Error("هذا الحساب لا يملك صلاحيات الإدارة.");
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  message.textContent = "جاري تسجيل الدخول...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = "تعذر تسجيل الدخول: " + error.message;
    return;
  }

  try {
    await verifyAdmin(data.user);
    message.textContent = "";
    showDashboard();
    await loadOrders();
  } catch (err) {
    await db.auth.signOut();
    message.textContent = err.message;
    showLogin();
  }
});

logoutBtn.addEventListener("click", async () => {
  await db.auth.signOut();
  ordersList.replaceChildren();
  showLogin();
});

function addDetail(container, label, value) {
  const box = document.createElement("div");
  box.className = "detail";

  const small = document.createElement("small");
  small.textContent = label;

  const content = document.createElement("div");
  content.textContent =
    value === null || value === undefined || value === ""
      ? "غير محدد"
      : String(value);

  box.append(small, content);
  container.appendChild(box);
}

async function loadOrders() {
  ordersMessage.textContent = "جاري تحميل الطلبات...";
  ordersList.replaceChildren();

  const { data, error } = await db
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    ordersMessage.textContent = "حدث خطأ: " + error.message;
    return;
  }

  const orders = data || [];

  document.getElementById("total").textContent = orders.length;
  document.getElementById("newCount").textContent =
    orders.filter(o => o.status === "new").length;
  document.getElementById("doneCount").textContent =
    orders.filter(o => o.status === "completed").length;

  ordersMessage.textContent = orders.length
    ? "عدد الطلبات: " + orders.length
    : "لا توجد طلبات حالياً.";

  orders.forEach(order => {
    const card = document.createElement("article");
    card.className = "order";

    const title = document.createElement("h3");
    title.textContent = "طلب رقم: " + order.id;
    card.appendChild(title);

    const details = document.createElement("div");
    details.className = "details";

    addDetail(details, "اسم الزبون", order.customer_name);
    addDetail(details, "رقم الهاتف", order.phone);
    addDetail(details, "المناسبة", order.occasion);
    addDetail(details, "القالب", order.template_name);
    addDetail(details, "الباقة", order.package_name);
    addDetail(details, "المبلغ", order.amount);
    addDetail(details, "طريقة الدفع", order.payment_method);
    addDetail(details, "إثبات الدفع", order.payment_proof);
    addDetail(details, "تاريخ المناسبة", order.invitation_date);
    addDetail(details, "وقت المناسبة", order.invitation_time);
    addDetail(details, "المكان", order.invitation_location);
    addDetail(details, "رسالة الدعوة", order.invitation_message);
    addDetail(details, "تاريخ الطلب", order.created_at
      ? new Date(order.created_at).toLocaleString("ar-IQ")
      : "");

    card.appendChild(details);

    const actions = document.createElement("div");
    actions.className = "actions";

    const select = document.createElement("select");

    Object.entries(statusNames).forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      select.appendChild(option);
    });

    select.value = order.status || "new";

    const updateBtn = document.createElement("button");
    updateBtn.textContent = "حفظ الحالة";

    updateBtn.addEventListener("click", async () => {
      updateBtn.disabled = true;

      const { error } = await db
        .from("orders")
        .update({ status: select.value })
        .eq("id", order.id);

      updateBtn.disabled = false;

      if (error) {
        alert("تعذر تحديث الطلب: " + error.message);
      } else {
        alert("تم تحديث حالة الطلب");
        await loadOrders();
      }
    });

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "حذف الطلب";
    deleteBtn.className = "danger";

    deleteBtn.addEventListener("click", async () => {
      if (!confirm("هل أنت متأكد من حذف هذا الطلب؟")) return;

      const { error } = await db
        .from("orders")
        .delete()
        .eq("id", order.id);

      if (error) {
        alert("تعذر حذف الطلب: " + error.message);
      } else {
        await loadOrders();
      }
    });

    actions.append(select, updateBtn, deleteBtn);
    card.appendChild(actions);
    ordersList.appendChild(card);
  });
}

document.getElementById("refreshBtn").addEventListener("click", loadOrders);

async function restoreSession() {
  const { data } = await db.auth.getSession();

  if (!data.session) return;

  try {
    await verifyAdmin(data.session.user);
    showDashboard();
    await loadOrders();
  } catch (err) {
    await db.auth.signOut();
    showLogin();
    message.textContent = err.message;
  }
}

restoreSession();
</script>
</body>
</html>
